<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="PatchWeave loom banner">
  <title>PatchWeave: changes woven onto requirements</title>
  <defs>
    <linearGradient id="pwNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1e3a"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="pwWarp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18"/>
      <stop offset="0.5" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <filter id="pwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" fill="url(#pwNavy)"/>

  <!-- warp threads (requirements) : vertical navy-highlight lines -->
  <g stroke="#1d3a63" stroke-width="2">
    <line x1="120" y1="40" x2="120" y2="260"/>
    <line x1="220" y1="40" x2="220" y2="260"/>
    <line x1="320" y1="40" x2="320" y2="260"/>
    <line x1="420" y1="40" x2="420" y2="260"/>
    <line x1="520" y1="40" x2="520" y2="260"/>
    <line x1="620" y1="40" x2="620" y2="260"/>
    <line x1="720" y1="40" x2="720" y2="260"/>
  </g>

  <!-- weft threads (changes) : horizontal electric-orange lines drawn across the loom -->
  <g stroke="url(#pwWarp)" stroke-width="3" fill="none" filter="url(#pwGlow)">
    <line x1="80" y1="80" x2="80" y2="80">
      <animate attributeName="x2" from="80" to="760" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="130" x2="80" y2="130">
      <animate attributeName="x2" from="80" to="760" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="180" x2="80" y2="180">
      <animate attributeName="x2" from="80" to="760" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="230" x2="80" y2="230">
      <animate attributeName="x2" from="80" to="760" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- shuttle : a small orange node that flies across, weaving -->
  <circle r="7" fill="#ffd7a8" stroke="#ff7a18" stroke-width="2">
    <animateMotion dur="2.4s" repeatCount="indefinite"
      path="M80,80 L760,80 L760,130 L80,130 L80,180 L760,180 L760,230 L80,230 Z"/>
    <animate attributeName="r" values="7;10;7" dur="0.6s" repeatCount="indefinite"/>
  </circle>

  <text x="800" y="70" font-family="Consolas, monospace" font-size="26" fill="#ff9a3c" font-weight="bold">PATCH</text>
  <text x="800" y="102" font-family="Consolas, monospace" font-size="26" fill="#7fb2ff" font-weight="bold">WEAVE</text>
  <text x="80" y="285" font-family="Consolas, monospace" font-size="13" fill="#5f7fa6">changes (weft) woven onto requirements (warp)</text>
</svg>
