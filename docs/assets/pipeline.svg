<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="PatchWeave pipeline">
  <title>PatchWeave: analysis pipeline</title>
  <defs>
    <linearGradient id="pwBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08182e"/>
      <stop offset="1" stop-color="#0d233f"/>
    </linearGradient>
    <marker id="pwArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff8a2a"/>
    </marker>
    <style>
      .stage { fill:#102a4d; stroke:#ff7a18; stroke-width:2; rx:10; }
      .label { font-family:Consolas, monospace; font-size:14px; fill:#e8f0ff; }
      .sub   { font-family:Consolas, monospace; font-size:11px; fill:#7fb2ff; }
      .flow  { stroke:#ff8a2a; stroke-width:2.5; fill:none; }
    </style>
  </defs>

  <rect width="900" height="360" fill="url(#pwBg2)"/>
  <text x="30" y="40" class="label" font-size="20" fill="#ff9a3c">PatchWeave pipeline</text>

  <!-- stages -->
  <g>
    <rect class="stage" x="30"  y="90" width="150" height="70" rx="10"/>
    <text x="105" y="120" text-anchor="middle" class="label">load</text>
    <text x="105" y="140" text-anchor="middle" class="sub">manifest+catalog</text>

    <rect class="stage" x="230" y="90" width="150" height="70" rx="10"/>
    <text x="305" y="120" text-anchor="middle" class="label">weave</text>
    <text x="305" y="140" text-anchor="middle" class="sub">resolve anchors</text>

    <rect class="stage" x="430" y="90" width="150" height="70" rx="10"/>
    <text x="505" y="120" text-anchor="middle" class="label">score</text>
    <text x="505" y="140" text-anchor="middle" class="sub">risk·gap·surface</text>

    <rect class="stage" x="630" y="90" width="150" height="70" rx="10"/>
    <text x="705" y="120" text-anchor="middle" class="label">brief</text>
    <text x="705" y="140" text-anchor="middle" class="sub">queue+report</text>
  </g>

  <!-- flow arrows -->
  <g class="flow" marker-end="url(#pwArrow)">
    <line x1="180" y1="125" x2="228" y2="125"/>
    <line x1="380" y1="125" x2="428" y2="125"/>
    <line x1="580" y1="125" x2="628" y2="125"/>
  </g>

  <!-- travelling packets show data moving through the pipeline -->
  <circle r="5" fill="#ffd7a8">
    <animate attributeName="cx" values="180;228;380;428;580;628" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="125;125;125;125;125;125" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;1;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>

